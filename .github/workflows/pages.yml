name: Publish snowflake workshop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout protected release
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify and stage encrypted pages
        shell: python
        run: |
          import hashlib, json, pathlib, re, shutil
          root = pathlib.Path('.')
          target = root / '_site'
          target.mkdir()
          manifest = json.loads((root / 'release-manifest.json').read_text())
          expected = {'index.html', 'previous.html', 'original.html'}
          assert {page['file'] for page in manifest['pages']} == expected
          for page in manifest['pages']:
              data = (root / page['file']).read_bytes()
              assert hashlib.sha256(data).hexdigest() == page['sha256'], page['file']
              assert b'id="password"' in data, page['file']
              assert b'id="construction-picker"' not in data, page['file']
          assert len(manifest.get('assets', [])) == 3
          icons = {'favicon.svg', 'favicon.ico'}
          icon_assets = [item for item in manifest['assets'] if item['file'] in icons]
          assert {item['file'] for item in icon_assets} == icons
          for icon in icon_assets:
              data = (root / icon['file']).read_bytes()
              assert len(data) == icon['bytes']
              assert hashlib.sha256(data).hexdigest() == icon['sha256']
          asset, = [item for item in manifest['assets'] if item['file'] not in icons]
          assert re.fullmatch(r'music-[0-9a-f]{12}\.bin', asset['file'])
          music = (root / asset['file']).read_bytes()
          assert len(music) == asset['bytes']
          assert hashlib.sha256(music).hexdigest() == asset['sha256']
          assert hashlib.sha256((root / 'music.bin').read_bytes()).hexdigest() == 'f7405932741af0accf7fd5fd2ea32fc6a87d46bf0a5228c1d7b6316e33ddc3a6'
          for name in sorted(expected | icons | {'README.md', 'release-manifest.json', '.nojekyll', 'music.bin', asset['file']}):
              shutil.copyfile(root / name, target / name)
          frost = root / 'assets/frost-grain.svg'
          assert hashlib.sha256(frost.read_bytes()).hexdigest() == 'ba91a0ca79d7fa55666f981fe3830ace1b319aec72b054df9488955eddd14e09'
          (target / 'assets').mkdir()
          shutil.copyfile(frost, target / 'assets/frost-grain.svg')
          alternate = root / 'formulas'
          if alternate.exists():
              fm = json.loads((alternate / 'release-manifest.json').read_text())
              assert len(fm['pages']) == 1 and fm['pages'][0]['file'] == 'index.html'
              data = (alternate / 'index.html').read_bytes()
              assert hashlib.sha256(data).hexdigest() == fm['pages'][0]['sha256']
              assert b'id="password"' in data and b'id="construction-picker"' not in data
              assert fm['assets'][0]['file'] == '../' + asset['file']
              assert fm['assets'][0]['sha256'] == asset['sha256']
              (target / 'formulas').mkdir()
              for name in ['index.html', 'release-manifest.json']:
                  shutil.copyfile(alternate / name, target / 'formulas' / name)
          print('Verified and staged encrypted pages, optional formula branch and release metadata.')
      - name: Upload verified site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
