name: Check runner scheduling
on:
  push:
    paths: ['.github/workflows/runner-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Confirm runner availability
        run: echo 'Runner started without a deployment environment or concurrency group.'
